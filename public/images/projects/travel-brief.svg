<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="100%" stop-color="#FFE3C2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#E85D2F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#skyGrad)"/>

  <!-- Faint dashed flight path -->
  <path d="M 90,340 Q 256,180 430,150" fill="none" stroke="#D97A4A" stroke-width="4"
        stroke-dasharray="2 14" stroke-linecap="round" opacity="0.5"/>

  <!-- Boarding-pass / brief card, tilted -->
  <g transform="translate(256,268) rotate(-8)">
    <rect x="-150" y="-96" width="300" height="192" rx="20" fill="#FFFFFF" stroke="#E9D9C8" stroke-width="2"/>

    <!-- Perforation notch -->
    <circle cx="-150" cy="0" r="14" fill="url(#skyGrad)"/>
    <circle cx="150" cy="0" r="14" fill="url(#skyGrad)"/>
    <line x1="-128" y1="0" x2="128" y2="0" stroke="#E9D9C8" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- Top: route -->
    <text x="-124" y="-50" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#22303F" font-weight="700">SCA</text>
    <path d="M -60,-58 h 60 l -14,-12 M -60,-58 l -14,12" fill="none" stroke="#E85D2F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="-50" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#22303F" font-weight="700">DXB</text>

    <!-- Small paper plane -->
    <g transform="translate(0,-64)">
      <path d="M -16,6 L 18,-10 L 4,10 L -6,8 Z" fill="url(#cardGrad)"/>
    </g>

    <!-- Lower half: brief lines -->
    <g transform="translate(-124,26)" stroke="#C9CFD6" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="0" x2="188" y2="0"/>
      <line x1="0" y1="24" x2="150" y2="24"/>
      <line x1="0" y1="48" x2="168" y2="48"/>
    </g>
  </g>
</svg>
