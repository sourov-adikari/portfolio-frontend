<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DDC97"/>
      <stop offset="100%" stop-color="#2AB7CA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle concentric rings suggesting listening/AI presence -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1F2E4D" stroke-width="2"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#1F2E4D" stroke-width="2"/>

  <!-- Central monogram: S C A woven as a single continuous stroke -->
  <g transform="translate(256,256)">
    <!-- S arc -->
    <path d="M -64,-40 C -92,-40 -92,4 -64,4 C -36,4 -36,48 -64,48"
          fill="none" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round"/>
    <!-- C arc -->
    <path d="M 30,-52 A 56,56 0 1 0 30,52"
          fill="none" stroke="#F5F7FA" stroke-width="14" stroke-linecap="round"/>
    <!-- A peak, doubling as a signal spike -->
    <path d="M 4,52 L 34,-52 L 64,52 M 16,16 L 52,16"
          fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Waveform baseline, referencing "assistant" listening state -->
  <g transform="translate(256,392)" stroke="url(#pulseGrad)" stroke-width="10" stroke-linecap="round">
    <line x1="-96" y1="0" x2="-96" y2="0"/>
    <line x1="-72" y1="-14" x2="-72" y2="14"/>
    <line x1="-48" y1="-26" x2="-48" y2="26"/>
    <line x1="-24" y1="-10" x2="-24" y2="10"/>
    <line x1="0" y1="-32" x2="0" y2="32"/>
    <line x1="24" y1="-10" x2="24" y2="10"/>
    <line x1="48" y1="-26" x2="48" y2="26"/>
    <line x1="72" y1="-14" x2="72" y2="14"/>
    <line x1="96" y1="0" x2="96" y2="0"/>
  </g>
</svg>
