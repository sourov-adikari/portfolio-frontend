<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Sourov Chandra Adikari, a Full Stack Web Developer building modern, responsive web applications." />
    <meta name="author" content="Sourov Chandra Adikari" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Sourov Chandra Adikari — Full Stack Web Developer</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
